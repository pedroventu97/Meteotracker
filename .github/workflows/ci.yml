name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[gui,test]"
      - run: python -m pytest -q -W error
      - run: QT_QPA_PLATFORM=offscreen python -c "from meteotracker_qc.gui import main; print('GUI import: PASS')"
