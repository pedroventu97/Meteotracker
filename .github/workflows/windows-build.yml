name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[gui,build]"
      - shell: pwsh
        run: .\scripts\build_windows.ps1 -Version $env:GITHUB_REF_NAME
      - uses: actions/upload-artifact@v4
        with:
          name: meteotracker-windows
          path: dist/
