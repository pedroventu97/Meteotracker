[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meteotracker-qc"
version = "0.1.0"
description = "Reproducible Meteotracker quality-control application"
readme = "docs/SCIENTIFIC_CLOSURE.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pandas>=3.0.5,<3.1",
  "numpy>=2.2,<2.6",
  "scipy>=1.14,<2",
  "matplotlib>=3.8,<4",
  "pyyaml>=6,<7",
  "pyproj>=3.7,<4",
  "geopandas>=1.1,<2",
  "shapely>=2.1,<3",
  "pyogrio>=0.13,<1",
  "pyarrow>=25,<26",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
meteotracker = "meteotracker_qc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["meteotracker_qc*"]
exclude = ["meteotracker_qc.gui*"]

[tool.setuptools.package-data]
meteotracker_qc = ["resources/*.yaml", "resources/*.csv"]

[tool.ruff]
line-length = 120
