[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meteotracker-qc"
version = "0.1.0"
description = "Reproducible Meteotracker quality-control application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0,<3",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "matplotlib>=3.8,<4",
  "pyyaml>=6,<7",
  "pyproj>=3.7,<4",
  "geopandas>=1.1,<2",
  "shapely>=2.1,<3",
  "pyogrio>=0.13,<1",
  "pyarrow>=16,<20",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
meteotracker = "meteotracker_qc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meteotracker_qc = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
